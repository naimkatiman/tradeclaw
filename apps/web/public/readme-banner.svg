<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1a12;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#10b981" stroke-width="0.3" opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bgGrad)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>

  <!-- Ambient glow -->
  <ellipse cx="640" cy="320" rx="420" ry="260" fill="#10b981" opacity="0.05"/>

  <!-- Claw icon -->
  <g transform="translate(590, 130)" filter="url(#glow)">
    <path d="M 40 20 C 38 40, 30 55, 20 80" stroke="#10b981" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M 55 15 C 55 38, 50 55, 45 82" stroke="#10b981" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M 70 20 C 72 42, 70 58, 70 84" stroke="#10b981" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M 20 20 L 80 20 L 85 8 L 15 8 Z" fill="#10b981"/>
  </g>

  <!-- TradeClaw wordmark -->
  <text x="640" y="330" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="84" font-weight="800" letter-spacing="-2">
    <tspan fill="white">Trade</tspan><tspan fill="#10b981">Claw</tspan>
  </text>

  <!-- Tagline -->
  <text x="640" y="390" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="24" fill="#9ca3af" letter-spacing="0.3">Open-source trading transparency.</text>
  <text x="640" y="425" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="24" fill="#9ca3af" letter-spacing="0.3">Every signal logged, graded, and published — wins and losses.</text>

  <!-- Feature pills -->
  <g transform="translate(453, 465)">
    <rect x="0" y="0" width="138" height="34" rx="17" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <text x="69" y="22" font-family="'Segoe UI', sans-serif" font-size="13" fill="#9ca3af" text-anchor="middle">Docker Ready</text>

    <rect x="150" y="0" width="118" height="34" rx="17" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <text x="209" y="22" font-family="'Segoe UI', sans-serif" font-size="13" fill="#9ca3af" text-anchor="middle">MIT License</text>

    <rect x="280" y="0" width="94" height="34" rx="17" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <text x="327" y="22" font-family="'Segoe UI', sans-serif" font-size="13" fill="#9ca3af" text-anchor="middle">Self-host</text>
  </g>

  <!-- Bottom link -->
  <text x="640" y="580" font-family="'Segoe UI', sans-serif" font-size="14" fill="#374151" text-anchor="middle">github.com/naimkatiman/tradeclaw</text>
</svg>
