services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: ${DB_NAME:-tradeclaw}
      POSTGRES_USER: ${DB_USER:-tradeclaw}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tradeclaw}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
    restart: unless-stopped

  migrate:
    image: timescale/timescaledb:latest-pg16
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${DB_USER:-tradeclaw}
      PGPASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      PGDATABASE: ${DB_NAME:-tradeclaw}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./apps/web/migrations:/migrations:ro
    entrypoint: >
      sh -c 'for f in /migrations/*.sql; do
        echo "Running $$f ...";
        psql -v ON_ERROR_STOP=1 -f "$$f";
      done && echo "Migrations complete"'
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://${DB_USER:-tradeclaw}:${DB_PASSWORD:?Set DB_PASSWORD in .env}@db:5432/${DB_NAME:-tradeclaw}
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      # Web app session/OAuth/link-token signing. Required — the app fails fast
      # (and every sign-in 500s) without it. The ws-server uses AUTH_SECRET instead.
      USER_SESSION_SECRET: ${USER_SESSION_SECRET:?Set USER_SESSION_SECRET in .env}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      APP_URL: ${APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_BASE_URL: ${APP_URL:-http://localhost:3000}
      MARKET_DATA_HUB_URL: ${MARKET_DATA_HUB_URL:-}
      MARKET_DATA_HUB_API_KEY: ${MARKET_DATA_HUB_API_KEY:-}
      CRON_SECRET: ${CRON_SECRET:-}
      SIGNAL_ENGINE_PRESET: ${SIGNAL_ENGINE_PRESET:-hmm-top3}
      WRITE_JSON_FALLBACK: ${WRITE_JSON_FALLBACK:-true}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_FREE_CHANNEL_ID: ${TELEGRAM_FREE_CHANNEL_ID:-}
      TELEGRAM_CHANNEL_ID: ${TELEGRAM_CHANNEL_ID:-}
      TELEGRAM_PUBLIC_CHANNEL_ID: ${TELEGRAM_PUBLIC_CHANNEL_ID:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-resend}
      EMAIL_TO: ${EMAIL_TO:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
      WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:-}
      WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY:-}
      WEB_PUSH_VAPID_SUBJECT: ${WEB_PUSH_VAPID_SUBJECT:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      RISK_PAPER_USER_ID: ${RISK_PAPER_USER_ID:-}
      METAAPI_TOKEN: ${METAAPI_TOKEN:-}
      METAAPI_ACCOUNT_ID: ${METAAPI_ACCOUNT_ID:-}
      EXECUTION_MODE: ${EXECUTION_MODE:-disabled}
      BINANCE_BASE_URL: ${BINANCE_BASE_URL:-https://testnet.binancefuture.com}
      BINANCE_MARKET_DATA_URL: ${BINANCE_MARKET_DATA_URL:-https://fapi.binance.com}
      BINANCE_API_KEY: ${BINANCE_API_KEY:-}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET:-}
      EXEC_DAILY_LOSS_PCT: ${EXEC_DAILY_LOSS_PCT:-5}
      EXEC_WEEKLY_LOSS_PCT: ${EXEC_WEEKLY_LOSS_PCT:-12}
      EXEC_SYMBOLS_FALLBACK: ${EXEC_SYMBOLS_FALLBACK:-BTCUSDT,ETHUSDT}
      EXEC_TELEGRAM_CHAT_ID: ${EXEC_TELEGRAM_CHAT_ID:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # NOTE: the previous `scanner` service ran packages/core (a types/util library with
  # no runnable entry), so the container exited immediately and restart-looped while
  # silently ignoring the SCAN_* env vars. Removed. The real interval scanner is the
  # agent daemon (packages/agent, `npm run agent:start`); add a service that builds and
  # runs it if/when self-hosters need an in-compose scanner.

  ws-server:
    build:
      context: .
      dockerfile: Dockerfile.ws-server
    ports:
      - "${WS_SERVER_PORT:-4000}:4000"
    environment:
      DATABASE_URL: postgres://${DB_USER:-tradeclaw}:${DB_PASSWORD:?Set DB_PASSWORD in .env}@db:5432/${DB_NAME:-tradeclaw}
      REDIS_URL: redis://redis:6379
      WS_SERVER_PORT: "4000"
      NODE_ENV: production
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      MARKET_DATA_HUB_URL: ${MARKET_DATA_HUB_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Monitoring stack (opt-in): `docker compose --profile monitoring up -d`.
  # Scrapes the app's /api/metrics endpoint. Kept out of the default stack so
  # `docker compose up` stays lean.
  prometheus:
    image: prom/prometheus:latest
    profiles: ["monitoring"]
    volumes:
      - ./grafana/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      # Lets prometheus.yml's host.docker.internal target resolve on Linux.
      - "host.docker.internal:host-gateway"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  db_data:
  redis_data:
  prometheus_data:
  grafana_data:
