name: Signal Alerts

on:
  # Schedule remains disabled while Cloudflare blocks GitHub-hosted runners.
  # Manual runs record/resolve signals, then invoke the authenticated app
  # broadcaster. GitHub never posts directly to a broker or messaging service.
  workflow_dispatch:

concurrency:
  group: signal-alerts
  cancel-in-progress: false

permissions:
  contents: none

jobs:
  post-new-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Record and resolve signal candidates
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error -X POST \
            https://tradeclaw.win/api/cron/signals \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -o /tmp/tradeclaw-cron-signals.json
          python3 -m json.tool /tmp/tradeclaw-cron-signals.json

      - name: Run fail-closed broadcast endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            https://tradeclaw.win/api/cron/telegram \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -o /tmp/tradeclaw-broadcast.json
          python3 -m json.tool /tmp/tradeclaw-broadcast.json
