name: Telegram Broadcast

on:
  # Schedule remains disabled while Cloudflare blocks GitHub-hosted runners.
  # Manual runs call the app's authenticated, fail-closed broadcast endpoint;
  # this workflow never sends directly to Telegram.
  workflow_dispatch:

permissions:
  contents: none

jobs:
  broadcast-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run gated TradeClaw broadcast
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            https://tradeclaw.win/api/cron/telegram \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -o /tmp/tradeclaw-broadcast.json
          python3 -m json.tool /tmp/tradeclaw-broadcast.json
